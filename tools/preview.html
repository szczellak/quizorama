<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Podgląd konturów</title>
  <style>
    body { margin: 16px; font: 12px system-ui, sans-serif; background: #fff; color: #222; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
    figure { margin: 0; padding: 4px; border: 1px solid #ddd; text-align: center; }
    svg { width: 100%; height: 72px; }
    path { fill: #14b8a6; stroke: #0f766e; stroke-width: 1; vector-effect: non-scaling-stroke; }
    .world path { fill: #ccc; stroke: none; }
    figcaption { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <!-- Arkusz kontrolny wszystkich konturów (otwórz po przegenerowaniu js/data/shapes.js). -->
  <div class="grid" id="grid"></div>
  <script src="../js/data/countries.js"></script>
  <script src="../js/data/shapes.js"></script>
  <script>
    const { countries, shapes } = window.Quizorama.data;
    const grid = document.getElementById('grid');
    for (const c of countries) {
      const s = shapes.countries[c.code];
      if (!s || !s.d) continue;
      grid.insertAdjacentHTML('beforeend',
        `<figure><svg viewBox="${s.viewBox}"><path d="${s.d}"/></svg><figcaption>${c.code} ${c.name}</figcaption></figure>`);
    }
    grid.insertAdjacentHTML('beforeend',
      `<figure class="world" style="grid-column: span 3"><svg viewBox="${shapes.world.viewBox}"><path d="${shapes.world.d}"/></svg><figcaption>mini-mapa</figcaption></figure>`);
  </script>
</body>
</html>
